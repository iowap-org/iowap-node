name: Build wheel

# Builds the iowap-node wheel and publishes it as a GitHub release
# (tag: wheel-v<version>, asset: iowap_node-<version>-py3-none-any.whl).
#
# Downstream automation keys off this release:
#   - iowap-ha  vendor-wheel.yml  (polls releases, vendors + bumps app version)
#   - iowap-docker refresh-node-base.yml (polls releases, rebuilds base+storage+server)
#
# Convention: a wheel release is only produced when the package version in
# pyproject.toml changed (fixes land as version-bump commits, e.g. 2.3.4 →
# 2.3.5). A fix without a bump is deliberately NOT released — same rule the
# HAOS supervisor enforces by never re-pulling identical image tags.
#
# Idempotent: if the release already exists, the asset is re-uploaded with
# --clobber (safe on workflow re-runs).

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "nodes/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # T-242 (audit F7): pytest + ruff gate BEFORE any build/publish — a red
  # suite must no longer produce a wheel. Ruff runs an explicit,
  # deterministic select that is green on the current tree; the broader
  # lint debt (84 findings under ruff 0.16's expanded default select) is
  # a separate task and must not turn the pipeline red.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet .
          python -m pip install --quiet pytest ruff

      - name: Seed sandbox ~/.relay (suite local-creds convention)
        run: |
          # RelayClient.__init__ loads the runtime token from $HOME/.relay
          # (otherwise it attempts live recovery). The suite has always run
          # against a seeded ~/.relay; CI seeds the same minimal fake -
          # nothing here dials a real relay.
          mkdir -p "$HOME/.relay"
          printf '{"token": "tp_ci_seed", "expires_at": null, "refreshed_at": null}\n' > "$HOME/.relay/iowap-agent.token"
          printf '{"node_id": "CISEED", "node_name": "ci-seed", "registration_secret": "rs_ciseed", "capabilities": [], "base_url": "http://192.0.2.1:8788"}\n' > "$HOME/.relay/iowap-agent.json"

      - name: Test gate (pytest)
        run: python -m pytest -q

      - name: Lint gate (high-signal ruff select — see T-242)
        run: python -m ruff check --select E9,F821,F811 .

  build-wheel:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Read version
        id: version
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Wheel version: $VER"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          TAG="wheel-v${VER}"
          ASSET="iowap_node-${VER}-py3-none-any.whl"
          if gh release view "$TAG" --json assets -q '.tag_name' >/dev/null 2>&1; then
            echo "Release $TAG exists — re-uploading asset with --clobber"
            gh release upload "$TAG" "dist/${ASSET}" --clobber
          else
            gh release create "$TAG" "dist/${ASSET}" \
              --title "iowap-node wheel ${VER}" \
              --notes "Automated wheel build of ${GITHUB_SHA::7}. Consumed by iowap-ha (vendor-wheel) and iowap-docker (refresh-node-base)."
          fi
          echo "--- release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'

  publish-pypi:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.build-wheel.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "wheel-v${VER}" -p "*.whl" -D dist
          ls -la dist/

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN secret not set — skipping publish (release asset is still on GitHub)"
            exit 0
          fi
          python -m pip install --quiet twine
          export TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN"
          # PyPI versions are immutable: an intentional re-run of this job for
          # an already-published version hits "File already exists" — that is
          # 'published successfully earlier', so treat it as success.
          if ! twine upload --non-interactive dist/*.whl | tee /tmp/twine.log; then
            if grep -qi "already exists" /tmp/twine.log; then
              echo "Version already on PyPI — idempotent re-run, treated as success"
              exit 0
            fi
            exit 1
          fi