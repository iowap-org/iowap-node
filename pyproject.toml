[project]
name = "iowap-node"
version = "2.0.0"
description = "IOWAP Node Framework — daemon, CLI, and handler runner for distributed agent nodes"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "python-multipart>=0.0.18",
    "zeroconf>=0.63",
]

[project.scripts]
node-cli = "nodes.common.node_cli:main"
node-daemon = "nodes.common.node_daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nodes"]

[tool.ruff]
line-length = 100
target-version = "py311"